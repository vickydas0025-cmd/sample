<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coffee Shop</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5e6d3;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
            color: #5c3317;
        }

        .coffee {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin: 10px 0;
            background-color: #fff8f0;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .coffee h3 {
            margin: 0;
            color: #5c3317;
        }

        .coffee p {
            margin: 5px 0;
        }

        input[type="number"] {
            width: 60px;
            padding: 8px;
        }

        .payment {
            margin-top: 25px;
            padding: 15px;
            background-color: #f8eee3;
            border-radius: 10px;
        }

        .total {
            text-align: right;
            font-size: 22px;
            font-weight: bold;
            color: #5c3317;
            margin-top: 20px;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #6f3e1e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background-color: #4d2813;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>☕ Vicky Coffee Shop</h1>

    <div class="coffee">
        <div>
            <h3>1. Espresso</h3>
            <p>₹80</p>
        </div>
        <input type="number" class="qty" data-price="80" min="0" value="0">
    </div>

    <div class="coffee">
        <div>
            <h3>2. Cappuccino</h3>
            <p>₹120</p>
        </div>
        <input type="number" class="qty" data-price="120" min="0" value="0">
    </div>

    <div class="coffee">
        <div>
            <h3>3. Latte</h3>
            <p>₹130</p>
        </div>
        <input type="number" class="qty" data-price="130" min="0" value="0">
    </div>

    <div class="coffee">
        <div>
            <h3>4. Americano</h3>
            <p>₹100</p>
        </div>
        <input type="number" class="qty" data-price="100" min="0" value="0">
    </div>

    <div class="coffee">
        <div>
            <h3>5. Mocha</h3>
            <p>₹150</p>
        </div>
        <input type="number" class="qty" data-price="150" min="0" value="0">
    </div>

    <div class="coffee">
        <div>
            <h3>6. Cold Coffee</h3>
            <p>₹140</p>
        </div>
        <input type="number" class="qty" data-price="140" min="0" value="0">
    </div>

    <div class="coffee">
        <div>
            <h3>7. Irish Coffee</h3>
            <p>₹180</p>
        </div>
        <input type="number" class="qty" data-price="180" min="0" value="0">
    </div>

    <div class="coffee">
        <div>
            <h3>8. Filter Coffee</h3>
            <p>₹70</p>
        </div>
        <input type="number" class="qty" data-price="70" min="0" value="0">
    </div>

    <div class="coffee">
        <div>
            <h3>9. Black Coffee</h3>
            <p>₹90</p>
        </div>
        <input type="number" class="qty" data-price="90" min="0" value="0">
    </div>

    <div class="coffee">
        <div>
            <h3>10. Caramel Coffee</h3>
            <p>₹160</p>
        </div>
        <input type="number" class="qty" data-price="160" min="0" value="0">
    </div>

    <div class="total">
        Total: ₹<span id="total">0</span>
    </div>

    <div class="payment">
        <h3>Payment Method</h3>

        <label>
            <input type="radio" name="payment" value="UPI" checked>
            UPI
        </label>

        <br><br>

        <label>
            <input type="radio" name="payment" value="Cash">
            Cash
        </label>
    </div>

    <button onclick="placeOrder()">Place Order</button>

    <div id="message"></div>

</div>


<script>

    // Get all quantity inputs
    let quantities = document.querySelectorAll(".qty");

    // Calculate total whenever quantity changes
    quantities.forEach(function(input) {

        input.addEventListener("input", calculateTotal);

    });


    function calculateTotal() {

        let total = 0;

        quantities.forEach(function(input) {

            let price = Number(input.dataset.price);
            let quantity = Number(input.value);

            total = total + (price * quantity);

        });

        document.getElementById("total").innerText = total;
    }


    function placeOrder() {

        let total = document.getElementById("total").innerText;

        let payment = document.querySelector(
            'input[name="payment"]:checked'
        ).value;

        if (total == 0) {

            document.getElementById("message").innerText =
                "Please select at least one coffee.";

        } else {

            document.getElementById("message").innerText =
                "Order placed successfully! Total: ₹" +
                total +
                " | Payment: " +
                payment;

        }
    }

</script>

</body>
</html>
